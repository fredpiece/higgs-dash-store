<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Luffy - One Piece Protagonist -->
  <!-- Background glow -->
  <defs>
    <linearGradient id="luffyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFD93D;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="140" r="90" fill="url(#luffyGlow)" />
  
  <!-- Straw Hat -->
  <ellipse cx="100" cy="45" rx="60" ry="20" fill="#D4A574" stroke="#8B6F47" stroke-width="2"/>
  <path d="M 50 45 Q 50 25 100 20 Q 150 25 150 45" fill="#E8C88C" stroke="#8B6F47" stroke-width="2"/>
  <path d="M 100 20 L 95 15 L 100 10 L 105 15 Z" fill="#8B6F47"/>
  
  <!-- Head -->
  <circle cx="100" cy="90" r="35" fill="#F4A460" stroke="#000" stroke-width="2"/>
  
  <!-- Hair (spiky black) -->
  <path d="M 75 65 Q 70 50 80 40 Q 85 35 100 30 Q 115 35 120 40 Q 130 50 125 65" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="85" r="6" fill="#000"/>
  <circle cx="115" cy="85" r="6" fill="#000"/>
  <circle cx="86" cy="83" r="2" fill="#fff"/>
  <circle cx="116" cy="83" r="2" fill="#fff"/>
  
  <!-- Smile -->
  <path d="M 90 105 Q 100 115 110 105" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Chest/Body -->
  <rect x="70" y="130" width="60" height="50" rx="5" fill="#FF6B6B" stroke="#000" stroke-width="2"/>
  
  <!-- Red jacket details -->
  <path d="M 70 135 L 130 135" stroke="#000" stroke-width="1"/>
  <circle cx="85" cy="145" r="3" fill="#FFD93D" stroke="#000" stroke-width="1"/>
  <circle cx="115" cy="145" r="3" fill="#FFD93D" stroke="#000" stroke-width="1"/>
  
  <!-- Arms -->
  <rect x="45" y="135" width="25" height="35" rx="12" fill="#F4A460" stroke="#000" stroke-width="2"/>
  <rect x="130" y="135" width="25" height="35" rx="12" fill="#F4A460" stroke="#000" stroke-width="2"/>
  
  <!-- Fists -->
  <circle cx="50" cy="175" r="10" fill="#F4A460" stroke="#000" stroke-width="2"/>
  <circle cx="150" cy="175" r="10" fill="#F4A460" stroke="#000" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="80" y="185" width="15" height="50" fill="#1a3a52" stroke="#000" stroke-width="2"/>
  <rect x="105" y="185" width="15" height="50" fill="#1a3a52" stroke="#000" stroke-width="2"/>
  
  <!-- Shoes -->
  <ellipse cx="87.5" cy="240" rx="12" ry="10" fill="#FFD93D" stroke="#000" stroke-width="2"/>
  <ellipse cx="112.5" cy="240" rx="12" ry="10" fill="#FFD93D" stroke="#000" stroke-width="2"/>
  
  <!-- Goggles on hat -->
  <rect x="75" y="32" width="15" height="12" rx="6" fill="none" stroke="#FF6B6B" stroke-width="2"/>
  <rect x="110" y="32" width="15" height="12" rx="6" fill="none" stroke="#FF6B6B" stroke-width="2"/>
  <line x1="93" y1="38" x2="108" y2="38" stroke="#FF6B6B" stroke-width="1.5"/>
</svg>