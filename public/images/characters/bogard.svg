<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Bogard - Grizzled Marine Commander -->
  <defs>
    <linearGradient id="bogardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="140" r="90" fill="url(#bogardGlow)" />
  
  <!-- Marine Cap -->
  <path d="M 55 60 L 145 60 Q 145 35 100 30 Q 55 35 55 60 Z" fill="#1a3a52" stroke="#000" stroke-width="2"/>
  <rect x="55" y="58" width="90" height="8" fill="#2a5a82" stroke="#000" stroke-width="1"/>
  <text x="100" y="68" font-size="10" fill="#FFD700" text-anchor="middle" font-weight="bold">MARINE</text>
  
  <!-- Head -->
  <circle cx="100" cy="95" r="32" fill="#D2B48C" stroke="#000" stroke-width="2"/>
  
  <!-- Scarred face - rugged look -->
  <line x1="85" y1="85" x2="75" y2="100" stroke="#8B4513" stroke-width="2" opacity="0.7"/>
  <line x1="115" y1="90" x2="125" y2="105" stroke="#8B4513" stroke-width="2" opacity="0.7"/>
  
  <!-- Eyes - stern -->
  <circle cx="82" cy="88" r="5" fill="#000"/>
  <circle cx="118" cy="88" r="5" fill="#000"/>
  <circle cx="83" cy="86" r="2" fill="#fff"/>
  <circle cx="119" cy="86" r="2" fill="#fff"/>
  
  <!-- Eyebrows - fierce -->
  <line x1="75" y1="78" x2="90" y2="76" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="76" x2="125" y2="78" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Stern mouth -->
  <path d="M 88 105 Q 100 110 112 105" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Beard stubble -->
  <circle cx="78" cy="115" r="1.5" fill="#333" opacity="0.6"/>
  <circle cx="95" cy="118" r="1.5" fill="#333" opacity="0.6"/>
  <circle cx="122" cy="115" r="1.5" fill="#333" opacity="0.6"/>
  
  <!-- Marine Uniform Coat -->
  <path d="M 65 125 L 65 180 Q 65 195 80 200 L 120 200 Q 135 195 135 180 L 135 125 Z" 
        fill="#2a5a82" stroke="#000" stroke-width="2"/>
  
  <!-- White undershirt -->
  <rect x="75" y="135" width="50" height="40" fill="#F5F5F5" stroke="none"/>
  
  <!-- Coat details -->
  <path d="M 100 125 L 100 200" stroke="#000" stroke-width="1" opacity="0.5"/>
  <circle cx="85" cy="150" r="3" fill="#FFD700" stroke="#000" stroke-width="1"/>
  <circle cx="115" cy="150" r="3" fill="#FFD700" stroke="#000" stroke-width="1"/>
  
  <!-- Arms in uniform -->
  <rect x="40" y="140" width="25" height="40" rx="8" fill="#D2B48C" stroke="#000" stroke-width="2"/>
  <rect x="135" y="140" width="25" height="40" rx="8" fill="#D2B48C" stroke="#000" stroke-width="2"/>
  
  <!-- Gloved hands -->
  <circle cx="45" cy="185" r="9" fill="#4A4A4A" stroke="#000" stroke-width="2"/>
  <circle cx="155" cy="185" r="9" fill="#4A4A4A" stroke="#000" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="80" y="200" width="14" height="48" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <rect x="106" y="200" width="14" height="48" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  
  <!-- Boots -->
  <ellipse cx="87" cy="255" rx="11" ry="10" fill="#8B4513" stroke="#000" stroke-width="2"/>
  <ellipse cx="113" cy="255" rx="11" ry="10" fill="#8B4513" stroke="#000" stroke-width="2"/>
  
  <!-- Shoulder boards (rank insignia) -->
  <rect x="50" y="130" width="12" height="20" fill="#FFD700" stroke="#000" stroke-width="1" rx="2"/>
  <rect x="138" y="130" width="12" height="20" fill="#FFD700" stroke="#000" stroke-width="1" rx="2"/>
</svg>