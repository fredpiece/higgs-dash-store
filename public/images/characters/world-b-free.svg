<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- World B. Free - 76ers Player #3 -->
  <defs>
    <linearGradient id="wbfGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1141;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1D428A;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="140" r="90" fill="url(#wbfGlow)" />
  
  <!-- Afro Hair -->
  <circle cx="100" cy="70" r="38" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
  <circle cx="75" cy="55" r="18" fill="#2a2a2a" stroke="none"/>
  <circle cx="125" cy="55" r="18" fill="#2a2a2a" stroke="none"/>
  <circle cx="70" cy="75" r="15" fill="#2a2a2a" stroke="none"/>
  <circle cx="130" cy="75" r="15" fill="#2a2a2a" stroke="none"/>
  
  <!-- Face -->
  <circle cx="100" cy="90" r="30" fill="#9B6B47" stroke="#000" stroke-width="2"/>
  
  <!-- Determined eyes -->
  <circle cx="82" cy="82" r="5" fill="#8B4513"/>
  <circle cx="118" cy="82" r="5" fill="#8B4513"/>
  <circle cx="83" cy="80" r="2" fill="#fff"/>
  <circle cx="119" cy="80" r="2" fill="#fff"/>
  
  <!-- Nose -->
  <line x1="100" y1="85" x2="100" y2="98" stroke="#6B4423" stroke-width="2"/>
  
  <!-- Focused expression - slight frown -->
  <path d="M 88 105 Q 100 112 112 105" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- 76ers Jersey - Red #3 -->
  <path d="M 60 125 L 60 185 Q 60 195 75 200 L 125 200 Q 140 195 140 185 L 140 125 Z" 
        fill="#CE1141" stroke="#000" stroke-width="2.5"/>
  
  <!-- Jersey number 3 -->
  <text x="100" y="175" font-size="45" font-weight="bold" fill="#1D428A" text-anchor="middle" font-family="Arial">3</text>
  
  <!-- Shoulder design -->
  <rect x="60" y="125" width="20" height="15" fill="#1D428A" stroke="#000" stroke-width="1"/>
  <rect x="120" y="125" width="20" height="15" fill="#1D428A" stroke="#000" stroke-width="1"/>
  
  <!-- Arms - athletic -->
  <rect x="35" y="140" width="25" height="45" rx="12" fill="#9B6B47" stroke="#000" stroke-width="2.5"/>
  <rect x="140" y="140" width="25" height="45" rx="12" fill="#9B6B47" stroke="#000" stroke-width="2.5"/>
  
  <!-- Wristbands -->
  <rect x="33" y="183" width="29" height="6" fill="#1D428A" stroke="#000" stroke-width="1"/>
  <rect x="138" y="183" width="29" height="6" fill="#1D428A" stroke="#000" stroke-width="1"/>
  
  <!-- Hands/Fists -->
  <circle cx="37" cy="195" r="10" fill="#9B6B47" stroke="#000" stroke-width="2"/>
  <circle cx="163" cy="195" r="10" fill="#9B6B47" stroke="#000" stroke-width="2"/>
  
  <!-- Athletic legs -->
  <rect x="78" y="200" width="16" height="45" fill="#1D428A" stroke="#000" stroke-width="2"/>
  <rect x="106" y="200" width="16" height="45" fill="#1D428A" stroke="#000" stroke-width="2"/>
  
  <!-- Basketball shoes -->
  <ellipse cx="86" cy="252" rx="13" ry="11" fill="#CE1141" stroke="#000" stroke-width="2"/>
  <ellipse cx="114" cy="252" rx="13" ry="11" fill="#CE1141" stroke="#000" stroke-width="2"/>
  
  <!-- Shoe details -->
  <line x1="82" y1="248" x2="90" y2="248" stroke="#fff" stroke-width="1.5"/>
  <line x1="110" y1="248" x2="118" y2="248" stroke="#fff" stroke-width="1.5"/>
  
  <!-- Basketball in hand -->
  <circle cx="37" cy="180" r="14" fill="#FF8C00" stroke="#000" stroke-width="1.5"/>
  <path d="M 30 180 Q 37 187 44 180" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 37 173 Q 44 180 37 187" stroke="#000" stroke-width="1" fill="none"/>
  
  <!-- Confidence aura -->
  <circle cx="100" cy="90" r="32" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
</svg>